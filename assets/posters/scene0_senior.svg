<polygon points="1000,660 1920,600 1920,760 1120,760" fill="url(#s0-floor)" filter="url(#s0-soft)"/>
<ellipse cx="1560" cy="700" rx="360" ry="46" fill="#e4ac59" fill-opacity=".16" filter="url(#s0-soft)"/>
