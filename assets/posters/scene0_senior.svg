<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
<!-- scene 0 · 경로당 선봉 · 오후 햇살이 나무 바닥에 떨어지는 실내. 추상 기하만(사진·글자 없음). 주 피사체 우측·상단, 하단 38% 어둡게 -->
<defs>
<radialGradient id="s0-glow" cx=".74" cy=".28" r=".46"><stop offset="0" stop-color="#e4ac59" stop-opacity=".8"/><stop offset=".45" stop-color="#a97c46" stop-opacity=".28"/><stop offset="1" stop-color="#111812" stop-opacity="0"/></radialGradient>
<linearGradient id="s0-pane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d2a0" stop-opacity=".55"/><stop offset=".7" stop-color="#e4ac59" stop-opacity=".22"/><stop offset="1" stop-color="#e4ac59" stop-opacity="0"/></linearGradient>
<linearGradient id="s0-floor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a97c46" stop-opacity="0"/><stop offset=".5" stop-color="#c9955a" stop-opacity=".28"/><stop offset="1" stop-color="#a97c46" stop-opacity=".06"/></linearGradient>
<linearGradient id="s0-shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060b07" stop-opacity="0"/><stop offset=".55" stop-color="#060b07" stop-opacity=".75"/><stop offset="1" stop-color="#040704"/></linearGradient>
<linearGradient id="s0-left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#040704" stop-opacity=".7"/><stop offset="1" stop-color="#040704" stop-opacity="0"/></linearGradient>
<filter id="s0-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="s0-haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="70"/></filter>
</defs>
<rect width="1920" height="1080" fill="#111812"/>
