<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
<!-- scene 5 · 세 이름과 두 자리 · 영업이 끝난 살롱 카페, 펜던트 조명 둘과 마주 놓인 자리 둘. 추상 기하만(브랜드·글자·사람 없음). 조명은 우측 절반, 하단 1/3 깊은 그늘 -->
<defs>
<linearGradient id="s5-cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0b771" stop-opacity=".6"/><stop offset="1" stop-color="#e0b771" stop-opacity="0"/></linearGradient>
<radialGradient id="s5-bulb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff0cf"/><stop offset=".5" stop-color="#e0b771" stop-opacity=".8"/><stop offset="1" stop-color="#e0b771" stop-opacity="0"/></radialGradient>
<radialGradient id="s5-room" cx=".7" cy=".3" r=".5"><stop offset="0" stop-color="#8a6a3a" stop-opacity=".35"/><stop offset=".6" stop-color="#3a2c18" stop-opacity=".12"/><stop offset="1" stop-color="#111812" stop-opacity="0"/></radialGradient>
<linearGradient id="s5-table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4a26" stop-opacity=".75"/><stop offset="1" stop-color="#2a1d10" stop-opacity="0"/></linearGradient>
<linearGradient id="s5-shelf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e0b771" stop-opacity="0"/><stop offset="1" stop-color="#e0b771" stop-opacity=".16"/></linearGradient>
<linearGradient id="s5-shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060b07" stop-opacity="0"/><stop offset=".55" stop-color="#060b07" stop-opacity=".82"/><stop offset="1" stop-color="#040704"/></linearGradient>
<linearGradient id="s5-left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#040704" stop-opacity=".82"/><stop offset="1" stop-color="#040704" stop-opacity="0"/></linearGradient>
<filter id="s5-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="s5-haze" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="48"/></filter>
</defs>
<rect width="1920" height="1080" fill="#0f0e0c"/>
<rect width="1920" height="1080" fill="url(#s5-room)"/>
<rect x="1560" y="80" width="360" height="560" fill="url(#s5-shelf)"/>
<g fill="#e0b771" fill-opacity=".1"><rect x="1600" y="150" width="320" height="10"/><rect x="1600" y="290" width="320" height="10"/><rect x="1600" y="430" width="320" height="10"/><rect x="1600" y="570" width="320" height="10"/></g>
<polygon points="1130,0 1250,0 1400,620 980,620" fill="url(#s5-cone)" filter="url(#s5-soft)"/>
<polygon points="1440,0 1560,0 1710,620 1290,620" fill="url(#s5-cone)" filter="url(#s5-soft)"/>
<rect x="1186" y="0" width="8" height="180" fill="#2a2118"/>
<rect x="1496" y="0" width="8" height="180" fill="#2a2118"/>
<polygon points="1150,180 1230,180 1250,240 1130,240" fill="#3a2c1a"/>
<polygon points="1460,180 1540,180 1560,240 1440,240" fill="#3a2c1a"/>
<ellipse cx="1190" cy="250" rx="60" ry="40" fill="url(#s5-bulb)"/>
<ellipse cx="1500" cy="250" rx="60" ry="40" fill="url(#s5-bulb)"/>
<polygon points="900,600 1920,560 1920,700 820,700" fill="url(#s5-table)"/>
<ellipse cx="1190" cy="615" rx="200" ry="40" fill="#e0b771" fill-opacity=".3" filter="url(#s5-haze)"/>
<ellipse cx="1500" cy="615" rx="200" ry="40" fill="#e0b771" fill-opacity=".3" filter="url(#s5-haze)"/>
<g fill="#1a140d">
<rect x="1070" y="640" width="120" height="14" rx="4"/><rect x="1080" y="654" width="12" height="120"/><rect x="1170" y="654" width="12" height="120"/>
<rect x="1540" y="640" width="120" height="14" rx="4"/><rect x="1550" y="654" width="12" height="120"/><rect x="1640" y="654" width="12" height="120"/>
</g>
<ellipse cx="1345" cy="596" rx="10" ry="16" fill="#ffd991"/>
<ellipse cx="1345" cy="600" rx="40" ry="26" fill="#e0b771" fill-opacity=".35" filter="url(#s5-soft)"/>
<rect x="0" y="0" width="900" height="1080" fill="url(#s5-left)"/>
<rect y="640" width="1920" height="440" fill="url(#s5-shade)"/>
</svg>
