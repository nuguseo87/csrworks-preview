<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
<!-- scene 4 · 뿌리(최부자 가훈) · 한옥 마당 저녁, 곳간의 열린 문 안쪽 등불 하나와 저녁 안개. 소품 셋(문·등불·안개)만. 문은 우측 절반, 좌하단 그늘 -->
<defs>
<radialGradient id="s4-lantern" cx=".5" cy=".42" r=".5"><stop offset="0" stop-color="#ffe0ad"/><stop offset=".35" stop-color="#ea9941" stop-opacity=".8"/><stop offset="1" stop-color="#5a3a16" stop-opacity="0"/></radialGradient>
<linearGradient id="s4-door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a86a2c" stop-opacity=".9"/><stop offset=".55" stop-color="#6e4318" stop-opacity=".85"/><stop offset="1" stop-color="#2a1a0b"/></linearGradient>
<radialGradient id="s4-spill" cx=".68" cy=".4" r=".42"><stop offset="0" stop-color="#ea9941" stop-opacity=".45"/><stop offset=".5" stop-color="#8c541f" stop-opacity=".14"/><stop offset="1" stop-color="#111812" stop-opacity="0"/></radialGradient>
<linearGradient id="s4-mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a927e" stop-opacity="0"/><stop offset=".5" stop-color="#b3a88f" stop-opacity=".3"/><stop offset="1" stop-color="#9a927e" stop-opacity="0"/></linearGradient>
<linearGradient id="s4-ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2f22" stop-opacity=".6"/><stop offset="1" stop-color="#0a0806" stop-opacity="0"/></linearGradient>
<linearGradient id="s4-shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060b07" stop-opacity="0"/><stop offset=".55" stop-color="#060b07" stop-opacity=".8"/><stop offset="1" stop-color="#040704"/></linearGradient>
<linearGradient id="s4-left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#040704" stop-opacity=".82"/><stop offset="1" stop-color="#040704" stop-opacity="0"/></linearGradient>
<filter id="s4-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="24"/></filter>
<filter id="s4-haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="64"/></filter>
</defs>
<rect width="1920" height="1080" fill="#100f0c"/>
<rect width="1920" height="1080" fill="url(#s4-spill)"/>
<polygon points="960,620 1920,560 1920,800 760,800" fill="url(#s4-ground)"/>
<rect x="1080" y="90" width="700" height="14" fill="#1a130c"/>
<rect x="1080" y="90" width="26" height="640" fill="#1a130c"/>
<rect x="1754" y="90" width="26" height="640" fill="#1a130c"/>
<rect x="1300" y="130" width="250" height="600" rx="4" fill="url(#s4-door)"/>
<rect x="1106" y="130" width="194" height="600" fill="#0c0906"/>
<rect x="1550" y="130" width="204" height="600" fill="#0c0906"/>
<rect x="1080" y="730" width="700" height="18" fill="#1a130c"/>
<ellipse cx="1425" cy="360" rx="150" ry="180" fill="url(#s4-lantern)" filter="url(#s4-soft)"/>
<circle cx="1425" cy="360" r="28" fill="#ffe9c4"/>
<rect x="1421" y="150" width="8" height="190" fill="#3a2a15"/>
<polygon points="1300,730 1550,730 1640,800 1210,800" fill="#c47b30" fill-opacity=".22" filter="url(#s4-soft)"/>
<rect x="200" y="540" width="1720" height="300" fill="url(#s4-mist)" filter="url(#s4-haze)"/>
<rect x="0" y="0" width="900" height="1080" fill="url(#s4-left)"/>
<rect y="640" width="1920" height="440" fill="url(#s4-shade)"/>
</svg>
