<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
<!-- scene 2 · 탄소중립 · 이른 아침 서늘한 소나무 숲, 옅은 안개와 빛줄기. 중성 톤(청색 캐스트 없음). 빛은 우상단, 하단 1/3 그늘 -->
<defs>
<radialGradient id="s2-sky" cx=".8" cy=".12" r=".55"><stop offset="0" stop-color="#c9d3c3" stop-opacity=".45"/><stop offset=".5" stop-color="#69887c" stop-opacity=".16"/><stop offset="1" stop-color="#0b1a12" stop-opacity="0"/></radialGradient>
<linearGradient id="s2-ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dfd0" stop-opacity=".34"/><stop offset="1" stop-color="#d9dfd0" stop-opacity="0"/></linearGradient>
<linearGradient id="s2-trunk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#050a07"/><stop offset=".6" stop-color="#0b432b" stop-opacity=".9"/><stop offset="1" stop-color="#050a07"/></linearGradient>
<linearGradient id="s2-mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#69887c" stop-opacity="0"/><stop offset=".5" stop-color="#8fa79b" stop-opacity=".28"/><stop offset="1" stop-color="#69887c" stop-opacity="0"/></linearGradient>
<linearGradient id="s2-shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060b07" stop-opacity="0"/><stop offset=".55" stop-color="#060b07" stop-opacity=".8"/><stop offset="1" stop-color="#040704"/></linearGradient>
<linearGradient id="s2-left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#040704" stop-opacity=".7"/><stop offset="1" stop-color="#040704" stop-opacity="0"/></linearGradient>
<filter id="s2-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
<filter id="s2-haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="60"/></filter>
</defs>
<rect width="1920" height="1080" fill="#0e1a13"/>
<rect width="1920" height="1080" fill="url(#s2-sky)"/>
<g filter="url(#s2-soft)">
<polygon points="1500,0 1640,0 1180,700 1090,700" fill="url(#s2-ray)"/>
<polygon points="1720,0 1860,0 1440,700 1350,700" fill="url(#s2-ray)"/>
<polygon points="1880,0 1920,0 1920,120 1640,700 1560,700" fill="url(#s2-ray)"/>
</g>
<g fill="url(#s2-trunk)">
<rect x="1040" y="0" width="58" height="1080"/>
<rect x="1260" y="0" width="74" height="1080"/>
<rect x="1470" y="0" width="52" height="1080"/>
<rect x="1690" y="0" width="82" height="1080"/>
<rect x="1860" y="0" width="60" height="1080"/>
<rect x="760" y="0" width="90" height="1080" fill-opacity=".9"/>
<rect x="420" y="0" width="120" height="1080" fill-opacity=".95"/>
</g>
<rect x="600" y="440" width="1320" height="320" fill="url(#s2-mist)" filter="url(#s2-haze)"/>
<g fill="#7c8a80" fill-opacity=".5">
<ellipse cx="1560" cy="690" rx="120" ry="26"/>
<ellipse cx="1360" cy="720" rx="90" ry="20"/>
</g>
<rect x="0" y="0" width="900" height="1080" fill="url(#s2-left)"/>
<rect y="640" width="1920" height="440" fill="url(#s2-shade)"/>
</svg>
